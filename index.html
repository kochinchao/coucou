<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>CouCou 左鄰右舍</title>
<!--2012462937-yNSur707 -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏘️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f1e7;--card:#fffdf8;--ink:#2e362d;--sub:#5d695b;--green:#46684d;--green-d:#375540;--mint:#e3ecdc;--orange:#bf5f35;--line:#e2dacb;--wall:#6b6254;--shadow:0 10px 30px #51442a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px;height:100%}
html[data-fs=l]{font-size:20px}
html[data-fs=xl]{font-size:22px}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;line-height:1.55;overflow-x:hidden}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #7fae83;outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:720px;margin:auto;min-height:100vh;padding:0 16px 130px;position:relative}

/* ===== 上方列 ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:74px;border-bottom:1px solid var(--line);flex-wrap:nowrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.brand-logo{flex:0 0 auto;height:56px;width:auto;display:block;filter:drop-shadow(0 2px 4px #51442a18)}
.logo-sub{color:var(--ink);font-weight:800;font-size:1.05rem}
.topright{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.points{display:flex;align-items:center;gap:5px;min-height:44px;padding:0 12px;border-radius:99px;background:#fff0cf;border:2px solid #f1dfb5;color:#6e5118;font-weight:800;font-size:.95rem;white-space:nowrap}
.points.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.person{flex:0 0 44px;width:44px;height:44px;border-radius:50%;background:#e4c3a2;font-weight:800;font-size:1.05rem}
@media(max-width:420px){.brand-logo{height:48px}.logo-sub{font-size:.95rem}}

.page{display:none}.page.active{display:block}
.page-head{padding:18px 0 14px}
.page-head h1{font-size:1.75rem;line-height:1.25}
.page-head p{color:var(--sub);margin-top:2px}
.kicker{font-weight:800;color:var(--green);letter-spacing:.03em;font-size:.95rem}

/* ===== 村莊首頁 ===== */
.greeting{padding:16px 0 12px}
.greeting h1{font-size:1.75rem;line-height:1.25;margin:2px 0 0;letter-spacing:-.01em}
.alert{display:none;gap:10px;align-items:flex-start;background:#fde9d6;border:2px solid #efb98e;border-radius:18px;padding:12px 14px;margin-bottom:14px;font-weight:500}
.alert.show{display:flex}
.alert span{flex:1}
.alert button{background:#fff;border-radius:12px;padding:8px 12px;font-weight:800;min-height:44px}

.street-card{border-radius:26px;background:var(--card);border:1px solid #e4ddcf;box-shadow:var(--shadow);overflow:hidden}
.street-heading{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 12px;padding:16px 16px 10px}
.street-heading h2{font-size:1.25rem;white-space:nowrap}
.street-heading span{color:var(--sub);font-size:.88rem;font-weight:700;white-space:nowrap}
.street-wrap{position:relative}
.street-scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#c8d3be transparent;-webkit-overflow-scrolling:touch}
.scene{position:relative;width:max-content;min-width:100%;overflow:hidden;--sky1:#cfe6ea;--sky2:#f1f0dc;--walk:#d9ccab;--plate-h:82px}
.scene.night{--sky1:#222d49;--sky2:#5a6a92;--walk:#b3a584}
.row{position:relative;display:flex;justify-content:center;align-items:flex-end;padding:34px 12px 0;background:linear-gradient(to bottom,var(--sky1),var(--sky2) calc(100% - var(--plate-h)),var(--walk) calc(100% - var(--plate-h)),var(--walk))}
.row:after{content:'';position:absolute;left:0;right:0;bottom:var(--plate-h);height:4px;background:#0000001a;pointer-events:none}
.cloud{z-index:1;position:absolute;font-size:2.6rem;opacity:.85;animation:drift 40s ease-in-out infinite alternate;pointer-events:none}
.scene.night .cloud{opacity:.25}
.star{z-index:1;position:absolute;display:none;font-size:.9rem;opacity:.9;pointer-events:none}
.scene.night .star{display:block}
@keyframes drift{to{transform:translateX(40px)}}
.tree{flex:0 0 auto;align-self:flex-end;font-size:3.2rem;line-height:1;margin:0 4px calc(var(--plate-h) - 6px);position:relative;z-index:0}

/* 房子：彼此相連的街屋 */
.house{--hw:6.5rem;--h:142px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;flex:0 0 var(--hw);width:var(--hw);margin-left:-3px;text-align:center;z-index:1;transition:transform .15s}
.house>span{display:block}
.house:active{transform:translateY(2px)}
.house.v1{--h:160px}.house.v2{--h:132px}
.house.mine{--hw:8.2rem;--h:172px;z-index:2}
.roof{height:48px;background:linear-gradient(#ffffff2e,#0000 45%),var(--roof);clip-path:polygon(50% 0,100% 100%,0 100%)}
.house.v1 .roof{height:20px;clip-path:none;border-radius:6px 6px 0 0;border:3px solid var(--wall);border-bottom:0}
.house.v2 .roof{height:38px;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%)}
.house.mine .roof{height:60px}
.body{position:relative;height:var(--h);background:var(--wall-c,var(--w));border:3px solid var(--wall);border-bottom:0}
.house .body{background:var(--w)}
.win{position:absolute;top:20px;width:30px;height:42px;border:4px solid #7a6c58;border-radius:6px;background:
  linear-gradient(#7a6c58,#7a6c58) center/3px 100% no-repeat,
  linear-gradient(#7a6c58,#7a6c58) center/100% 3px no-repeat,
  linear-gradient(135deg,#ffffff1f 0 28%,#0000 28%),#2b3444}
.win.l{left:13px}.win.r{right:13px}
.house.mine .win{width:40px;height:54px;top:24px}
.house.mine .win.l{left:18px}.house.mine .win.r{right:18px}
.house.on .win{background:
  linear-gradient(#a8832f,#a8832f) center/3px 100% no-repeat,
  linear-gradient(#a8832f,#a8832f) center/100% 3px no-repeat,
  radial-gradient(circle at 50% 65%,#fff6b8,#ffd45e 70%);
  border-color:#a8832f;box-shadow:0 0 22px 6px #ffcf5a99;animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 30px 10px #ffcf5acc}}
.door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:36px;height:58px;background:#a8683f;border:3px solid #5f4a38;border-bottom:0;border-radius:24px 24px 0 0}
.door:after{content:'';position:absolute;right:6px;top:32px;width:6px;height:6px;border-radius:50%;background:#ffe4a2}
.house.mine .door{width:48px;height:72px}
.house.off{filter:saturate(.8) brightness(.97)}
.house.cobweb{filter:saturate(.55) brightness(.88)}
.win .web{display:none;position:absolute;inset:-2px;pointer-events:none;opacity:.92}
.house.cobweb .win .web{display:block}
.corner-web{display:none;position:absolute;top:0;right:0;width:38px;height:38px;pointer-events:none;opacity:.85}
.house.cobweb .corner-web{display:block}
.house>.plate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:var(--plate-h);padding:6px 4px;width:100%}
.nm{font-size:.98rem;line-height:1.25;font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.st{font-style:normal;font-size:.78rem;line-height:1.3;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
.house.on .st{background:#fff0c4;color:#6a4e10}
.house.off .st{background:#ebe5d8;color:#55524a}
.house.away .st{background:#dceaf7;color:#27527a}
.house.cobweb .st{background:#f9dcd8;color:#8c2d19}
.house.highlight{animation:housePulse 1.2s ease-in-out 2}
@keyframes housePulse{50%{transform:translateY(-8px) scale(1.04)}}

/* 搜尋好友列 */
.search-bar{display:flex;gap:8px;align-items:center;padding:0 16px 10px}
.search-input-wrap{position:relative;flex:1;min-width:0}
.search-input-wrap input{width:100%;min-height:48px;border:2px solid #d8d1c0;border-radius:14px;padding:0 38px 0 12px;font:inherit;font-size:.95rem;background:#fff;text-overflow:ellipsis}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:#ece6d8;font-size:.9rem;font-weight:800;display:none}
.search-clear.show{display:grid;place-items:center}
.search-results{display:none;gap:8px;padding:0 16px 12px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.search-results::-webkit-scrollbar{display:none}
.search-results.show{display:flex}
.s-chip{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:99px;background:#f3f0e7;border:2px solid #dfd7c6;font-weight:800;font-size:.9rem;flex:0 0 auto}
.s-chip.on{background:#fff5d6;border-color:#ebcb78}
.lot{display:flex;flex-direction:column;justify-content:flex-end;flex:0 0 6.2rem;width:6.2rem;margin-left:-3px;padding:0 6px var(--plate-h);z-index:0}
.lot-in{height:90px;font-size:.88rem;border:3px dashed #8f836c;border-radius:12px;display:grid;place-items:center;text-align:center;font-weight:800;color:#5f5646;background:#ffffff77;line-height:1.35}
.lot-in b{display:block;font-size:1.4rem}
.road{position:relative;height:44px;background:repeating-linear-gradient(90deg,#f6efdc 0 28px,#0000 28px 56px) 0 20px/100% 4px no-repeat,#a39880;border-top:4px solid #8d826b}
.dog{position:absolute;bottom:2px;left:-40px;font-size:1.5rem;transform:scaleX(-1);animation:stroll 50s linear infinite}
@keyframes stroll{to{left:100%}}
.arrow{position:absolute;top:34%;z-index:5;width:46px;height:46px;border-radius:50%;background:#fffdf8ee;border:2px solid #cdc3af;font-size:1.15rem;box-shadow:0 4px 12px #0002;display:none}
.arrow.l{left:6px}.arrow.r{right:6px}
.street-wrap.has-scroll .arrow{display:grid;place-items:center}
.dock{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.dock .btn{flex:1;min-width:130px}.dock .btn.light{flex:0 0 auto}

/* 共用按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:56px;padding:0 20px;border-radius:16px;font-weight:800;font-size:1.05rem;background:var(--green);color:#fff;text-align:center;line-height:1.25}
.btn:active{filter:brightness(.92)}
.btn.light{background:var(--mint);color:#2f4c36}
.btn.orange{background:var(--orange)}
.btn.big{width:100%;min-height:62px;font-size:1.15rem}
.btn:disabled{opacity:.55}
.link{display:block;margin:16px auto 0;color:var(--sub);text-decoration:underline;font-size:.95rem;padding:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}

/* ===== 任務 ===== */
.sum{padding:16px 18px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.sum b{font-size:1.5rem;color:#8a5a12;margin:0 4px}
.meter{height:12px;background:#ece6d8;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8cab78,#f2c66d);border-radius:99px;transition:width .4s}
.task{padding:16px 18px;margin-bottom:14px}
.task-h{display:flex;align-items:center;gap:12px}
.task-ico{flex:0 0 52px;height:52px;border-radius:16px;background:#f2eee2;display:grid;place-items:center;font-size:1.7rem}
.task-h h3{font-size:1.15rem}
.task-h p{color:var(--sub);font-size:.95rem}
.task-h .state{margin-left:auto;font-weight:800;color:var(--green);font-size:.95rem;text-align:right;white-space:nowrap}
.stepbig{font-size:2.4rem;font-weight:800;margin:10px 0 4px;line-height:1.1}
.stepbig small{font-size:1rem;color:var(--sub);font-weight:500}
.stepbar{position:relative;height:16px;background:#ece6d8;border-radius:99px;margin:8px 0 14px;overflow:visible}
.stepbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8cab78,#4f8a5a);border-radius:99px;transition:width .4s}
.stepbar u{position:absolute;top:-3px;bottom:-3px;width:3px;background:#a99b82;border-radius:2px}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tier{text-align:center;padding:8px 4px;border-radius:14px;background:#f3f0e7;color:#55604f;font-size:.9rem;font-weight:500;line-height:1.35}
.tier b{font-size:1.05rem;color:#8a5a12}
.tier.hit{background:#e2f0da;color:#2f5a36;font-weight:700}
.step-in{display:flex;gap:8px;margin-top:14px}
.step-in input{flex:1;min-width:0;border:2px solid #d8d1c0;border-radius:14px;padding:0 14px;min-height:56px;font:inherit;background:#fff;font-size:1.1rem}
.small-note{color:var(--sub);font-size:.88rem;margin-top:8px}
.hintbox{margin:6px 0 14px;padding:14px 16px;border-radius:16px;background:#f6eedb;color:#6b5429;font-size:.95rem;line-height:1.7}

/* ===== 遊戲首頁 ===== */
.gcard{display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:14px;flex-wrap:wrap}
.gi{flex:0 0 58px;height:58px;border-radius:18px;background:#f2eee2;display:grid;place-items:center;font-size:2rem}
.gt{flex:1 1 170px;min-width:0}
.gt h3{font-size:1.25rem}
.gt p{color:var(--sub);font-size:.95rem;line-height:1.45}
.gt small{display:block;margin-top:4px;color:#7a5410;font-weight:700;font-size:.86rem;line-height:1.4}
.gcard .btn{flex:0 0 auto;min-width:84px;min-height:50px;padding:0 16px;margin-left:auto}

/* ===== 村長（文字＋圖片上傳辨識） ===== */
.box{padding:20px}
.box h2{font-size:1.25rem;margin-bottom:6px}
.box p{color:var(--sub);margin-bottom:14px}
textarea{width:100%;min-height:120px;border:2px solid #d8d1c0;border-radius:16px;padding:14px;font:inherit;font-size:1.05rem;background:#fff;resize:vertical}
.upload-zone{margin-top:12px;border:3px dashed #b8c4b1;border-radius:18px;padding:16px;background:#f7faf5;text-align:center;transition:background .2s}
.upload-zone:hover{background:#eef5ea}
.upload-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.upload-btns .btn{flex:1;min-width:140px}
.img-preview-wrap{display:none;margin-top:12px;position:relative;background:#fff;border:2px solid #d8d1c0;border-radius:16px;padding:10px;text-align:center}
.img-preview-wrap.show{display:block}
.img-preview-wrap img{max-width:100%;max-height:260px;border-radius:12px;object-fit:contain;display:block;margin:0 auto}
.img-clear{margin-top:8px;display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:99px;background:#fde0d6;color:#983716;font-weight:800;font-size:.9rem}
.rowbtn{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.rowbtn .btn{flex:1}
.result{display:none;margin-top:14px;border-radius:16px;padding:16px;line-height:1.8}
.result.show{display:block}
.result.r0{background:#e9f3e3}.result.r1{background:#fff2cf}.result.r2{background:#fde0d6}
.result ul{margin:6px 0;padding-left:1.2em}

/* ===== 小舖 ===== */
.shophead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;background:#edeedc;border-radius:22px;margin:14px 0}
.shophead h1{font-size:1.5rem}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex:0 0 auto;min-height:46px;padding:0 16px;border-radius:99px;background:#f1eee5;font-weight:800;color:#55604f;border:2px solid transparent}
.cat-tab.on{background:var(--mint);color:var(--green-d);border-color:var(--green)}
.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.product{padding:14px;display:flex;flex-direction:column;position:relative}
.product .art{height:80px;display:grid;place-items:center;background:#f5f0e5;border-radius:16px;font-size:2.8rem}
.product h3{font-size:1.05rem;margin:10px 0 2px}
.product p{color:var(--sub);font-size:.9rem;flex:1;line-height:1.45}
.price{color:#80581a;font-weight:
